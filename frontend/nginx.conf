# Config do nginx que serve o frontend em produção e faz proxy reverso
# das rotas do backend. `backend` é o nome do serviço no
# docker-compose.prod.yml (resolução de DNS interna do Docker).

upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Tamanho máximo de upload (ajuste se anexos entrarem no roadmap).
    client_max_body_size 10m;

    # SPA: qualquer rota desconhecida cai no index.html pro React Router
    # resolver client-side (ex.: /presenca/3 ao dar refresh).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API REST → gunicorn.
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin do Django → gunicorn.
    location /admin/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Estáticos do Django (admin/DRF), servidos pelo WhiteNoise no backend.
    location /static/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
