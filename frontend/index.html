<!doctype html>
<!-- App em light mode permanente (paleta olive/linho — ver src/index.css).
     Sem classe `dark` no html: a paleta vive nos tokens semânticos do
     :root, e os componentes shadcn herdam tudo automaticamente. Se um
     dia entrarmos com tema dark, a classe volta aqui via toggle. -->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Sinaliza pro browser que o app é light-only — desabilita o
         "force dark mode" automático do Chrome/Opera GX/Edge que
         inverte cores de sites sem `prefers-color-scheme`. -->
    <meta name="color-scheme" content="light" />
    <!-- Fraunces (serif variable) — usada em títulos via `font-heading`.
         Carregada via <link> em vez de @import no CSS pra evitar conflito
         com a ordem de @imports do Tailwind/fontsource. Preconnect acelera
         o handshake TLS com o servidor de fontes do Google. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..900&display=swap"
    />
    <title>Diário Escolar</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
