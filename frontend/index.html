<!doctype html>
<!-- A classe `dark` ativa a paleta dark definida em src/index.css —
     dark mode permanente, sem toggle. Aplicar no HTML em vez de via
     JS evita flash de tema light durante o carregamento. -->
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Diário Escolar</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
