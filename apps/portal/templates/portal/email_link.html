{% comment %}
   Email com link de definição de senha do portal (convite ou redefinição).
   Só tabelas + estilos inline: clientes de email removem <style>, <head> e
   classes. Paleta da marca em hex — email não tem CSS variables. Mesmo
   desenho do email de redefinição do staff (apps/accounts/services.py).
{% endcomment %}<!DOCTYPE html>
<html lang="pt-BR">
<body style="margin:0;padding:0;background:#ebe2d1;font-family:Georgia,'Times New Roman',serif;color:#2d2a24;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#ebe2d1;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="560" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;width:100%;background:#f5efe0;border-radius:12px;border:1px solid #d9cfb8;">
          <tr>
            <td style="padding:32px 32px 8px 32px;font-family:'Helvetica Neue',Arial,sans-serif;">
              <p style="margin:0 0 4px 0;font-size:11px;letter-spacing:0.25em;text-transform:uppercase;color:#4d5a2e;">{{ escola }}</p>
            </td>
          </tr>
          <tr>
            <td style="padding:8px 32px 0 32px;">
              <h1 style="margin:0;font-family:Georgia,'Times New Roman',serif;font-weight:500;font-size:26px;line-height:1.2;color:#2d2a24;">{{ titulo }}</h1>
              <div style="height:1px;width:40px;background:#b07d62;margin:16px 0 24px 0;"></div>
            </td>
          </tr>
          <tr>
            <td style="padding:0 32px;font-family:'Helvetica Neue',Arial,sans-serif;font-size:15px;line-height:1.55;color:#2d2a24;">
              <p style="margin:0 0 16px 0;">Olá, {{ nome }}.</p>
              <p style="margin:0 0 24px 0;">{{ texto }}</p>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:8px 32px 24px 32px;">
              <a href="{{ link }}" style="display:inline-block;background:#4d5a2e;color:#ebe2d1;text-decoration:none;font-family:'Helvetica Neue',Arial,sans-serif;font-size:15px;font-weight:500;padding:14px 28px;border-radius:8px;">{{ botao }}</a>
            </td>
          </tr>
          <tr>
            <td style="padding:0 32px 16px 32px;font-family:'Helvetica Neue',Arial,sans-serif;font-size:12px;line-height:1.5;color:#6b6859;">
              <p style="margin:0 0 8px 0;">Se o botão não abrir, copie este endereço no navegador:</p>
              <p style="margin:0;word-break:break-all;"><a href="{{ link }}" style="color:#b07d62;text-decoration:underline;">{{ link }}</a></p>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 32px 32px 32px;">
              <div style="height:1px;width:40px;background:#b07d62;margin:0 0 16px 0;"></div>
              <p style="margin:0;font-family:'Helvetica Neue',Arial,sans-serif;font-size:12px;line-height:1.5;color:#6b6859;">{{ rodape }}</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
