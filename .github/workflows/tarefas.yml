# Gatilho das tarefas periódicas do projeto.
#
# Por que aqui e não no Render: o projeto não tinha cron configurado em
# ambiente nenhum, e o Actions agendado é gratuito — não entra provedor
# novo, o repo já usa Actions, e a chamada ainda acorda o serviço que
# hiberna no free tier.
#
# O que este workflow NÃO é: um lugar com acesso ao banco. Ele só faz uma
# chamada HTTP autenticada por token. Rodar `manage.py` daqui exigiria o
# `DATABASE_URL` de produção nos secrets do GitHub, e aí o CI passaria a
# alcançar o banco da escola — bem pior que uma rota com token.
#
# Dois segredos, em Settings → Secrets and variables → Actions:
#   BACKEND_URL    — raiz do backend, sem barra no fim
#   TAREFAS_TOKEN  — o mesmo valor da env `TAREFAS_TOKEN` no servidor
#
# Sem eles o job termina avisando, em vez de falhar vermelho a cada
# quinze minutos: um repo sem os secrets é o estado normal de quem
# clonou o projeto.
#
# **Os minutos são quebrados de propósito.** O GitHub avisa que workflow
# agendado na virada da hora atrasa sob carga da plataforma, e é nela que
# todo mundo agenda. Por isso `:11` e `:41` em vez do `0 6` e `30 6` que
# o `FINANCEIRO.md` §2.2 registrou pra um crontab comum — a intenção
# (dia 1, de manhã, emissão meia hora depois da geração) é a mesma.
#
# Cada entrada de `schedule` roda o seu próprio conjunto, resolvido pelo
# `github.event.schedule`. Os minutos não se cruzam entre as entradas, pra
# que nunca haja dúvida sobre qual disparou.
name: Tarefas periódicas

on:
  schedule:
    # A cada 15 minutos: reenvio do outbox e retomada de comunicado
    # travado no meio do lote.
    - cron: "3,18,33,48 * * * *"
    # Diário, 04:11 em São Paulo: marca fatura vencida e limpa token de
    # redefinição expirado.
    - cron: "11 7 * * *"
    # Dia 1, 03:11 em São Paulo: gera as faturas da competência.
    - cron: "11 6 1 * *"
    # Dia 1, meia hora depois: emite as cobranças no gateway. Separado da
    # geração de propósito — ver `FINANCEIRO.md`, a geração é
    # transacional e em lote, e pendurar HTTP ali prenderia o lock pelo
    # tempo do provedor.
    - cron: "41 6 1 * *"
  workflow_dispatch:
    inputs:
      tarefas:
        description: "Apelidos separados por vírgula (ex.: email,comunicados)"
        required: true
        default: "email,comunicados"

jobs:
  executar:
    runs-on: ubuntu-latest
    steps:
      - name: Resolver quais tarefas rodar
        id: quais
        env:
          AGENDA: ${{ github.event.schedule }}
          MANUAL: ${{ github.event.inputs.tarefas }}
        run: |
          case "$AGENDA" in
            "3,18,33,48 * * * *") TAREFAS="email,comunicados" ;;
            "11 7 * * *")         TAREFAS="vencidas,tokens" ;;
            "11 6 1 * *")         TAREFAS="faturas" ;;
            "41 6 1 * *")         TAREFAS="cobrancas" ;;
            # Sem agenda = disparo manual.
            "")                   TAREFAS="$MANUAL" ;;
            *)
              echo "Agenda '$AGENDA' sem conjunto mapeado — nada a fazer."
              echo "Isto acontece se alguém acrescentar um cron acima e"
              echo "esquecer de mapeá-lo aqui."
              exit 1
              ;;
          esac
          echo "tarefas=$TAREFAS" >> "$GITHUB_OUTPUT"
          echo "Conjunto: $TAREFAS"

      - name: Disparar
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          TAREFAS_TOKEN: ${{ secrets.TAREFAS_TOKEN }}
          TAREFAS: ${{ steps.quais.outputs.tarefas }}
        run: |
          if [ -z "$BACKEND_URL" ] || [ -z "$TAREFAS_TOKEN" ]; then
            echo "BACKEND_URL ou TAREFAS_TOKEN não configurados — nada a fazer."
            exit 0
          fi

          # `--max-time` generoso: o free tier do Render hiberna, e a
          # primeira chamada depois disso paga o cold start do container.
          # `--fail-with-body` pra que um 401 apareça no log com o corpo,
          # em vez de só com o código.
          curl --silent --show-error --fail-with-body \
               --max-time 180 \
               --request POST \
               --header "X-Tarefas-Token: $TAREFAS_TOKEN" \
               "$BACKEND_URL/api/v1/tarefas/executar/?tarefas=$TAREFAS"
